name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: UI, API, DB, and e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: |
          set +e
          npm test > test-log.txt 2>&1
          status=$?
          cat test-log.txt
          if [ "$status" -ne 0 ]; then
            tail -n 30 test-log.txt | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error title=Playwright::$safe"
            done
          fi
          exit $status

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
